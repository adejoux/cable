name: Go tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
